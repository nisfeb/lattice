# usvg 0.48.1 as crates.io has it (src/, the licences and the readme), with one change:
# `ImageHrefResolver::default_string_resolver` in `src/parser/image.rs` resolves nothing. Upstream's
# reads whatever file an `<image href>` names from this computer's disk. Blitz hands every drawing in
# a page to usvg with the default options and has no way to be given others, so the default itself is
# what has to be safe. The command-line program (`src/main.rs`) is left out.
# Take this copy away once blitz-dom lets its caller set usvg's options, and copy it again, with the
# change, when the usvg that blitz-dom asks for moves.
[package]
edition = "2024"
rust-version = "1.85.0"
name = "usvg"
version = "0.48.1"
build = false
exclude = ["tests"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An SVG simplification library."
documentation = "https://docs.rs/usvg/"
readme = "README.md"
keywords = ["svg"]
categories = ["multimedia::images"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/resvg"
resolver = "2"

[features]
default = [
    "svgz",
    "text",
    "system-fonts",
    "memmap-fonts",
    "writer",
]
memmap-fonts = ["fontdb/memmap"]
svgz = ["flate2"]
system-fonts = [
    "fontdb/fs",
    "fontdb/fontconfig",
]
text = [
    "fontdb",
    "harfrust",
    "skrifa",
    "unicode-bidi",
    "unicode-script",
    "unicode-vo",
    "writer",
]
writer = [
    "xmlwriter",
    "base64",
]

[lib]
name = "usvg"
path = "src/lib.rs"

[dependencies.base64]
version = "0.23"
optional = true

[dependencies.data-url]
version = "0.3"

[dependencies.flate2]
version = "1.1"
features = ["rust_backend"]
optional = true
default-features = false

[dependencies.fontdb]
version = "0.24"
optional = true
default-features = false

[dependencies.harfrust]
version = "0.12.0"
optional = true

[dependencies.imagesize]
version = "0.15.0"

[dependencies.kurbo]
version = "0.13.0"

[dependencies.log]
version = "0.4"

[dependencies.pico-args]
version = "0.5"
features = ["eq-separator"]

[dependencies.roxmltree]
version = "0.21.1"

[dependencies.simplecss]
version = "0.2"

[dependencies.siphasher]
version = "1.0"

[dependencies.skrifa]
version = "0.44"
features = ["std"]
optional = true
default-features = false

[dependencies.strict-num]
version = "0.1.1"

[dependencies.svgtypes]
version = "0.16.1"

[dependencies.tiny-skia-path]
version = "0.12.0"

[dependencies.unicode-bidi]
version = "0.3"
optional = true

[dependencies.unicode-script]
version = "0.5"
optional = true

[dependencies.unicode-vo]
version = "0.1"
optional = true

[dependencies.xmlwriter]
version = "0.1"
optional = true

[dev-dependencies.once_cell]
version = "1.21"
