# usvg 0.45.1 as crates.io has it (src/, the licences and the readme), with the one change
# `vendor/usvg` has: `ImageHrefResolver::default_string_resolver` in `src/parser/image.rs` resolves
# nothing. This is the usvg that Rune's picture cache reads a drawing with (`rune::image`, through
# resvg), with the default options, for every picture a Markdown page shows.
# Take this copy away once Rune reads drawings with a resolver of its own, and copy it again, with
# the change, when the usvg that Rune's resvg asks for moves.
[package]
edition = "2021"
rust-version = "1.65.0"
name = "usvg"
version = "0.45.1"
build = false
exclude = ["tests"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An SVG simplification library."
documentation = "https://docs.rs/usvg/"
readme = "README.md"
keywords = ["svg"]
categories = ["multimedia::images"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/resvg"

[features]
default = [
    "text",
    "system-fonts",
    "memmap-fonts",
]
memmap-fonts = ["fontdb/memmap"]
system-fonts = [
    "fontdb/fs",
    "fontdb/fontconfig",
]
text = [
    "fontdb",
    "rustybuzz",
    "unicode-bidi",
    "unicode-script",
    "unicode-vo",
]

[lib]
name = "usvg"
path = "src/lib.rs"

[dependencies.base64]
version = "0.22"

[dependencies.data-url]
version = "0.3"

[dependencies.flate2]
version = "1.0"
features = ["rust_backend"]
default-features = false

[dependencies.fontdb]
version = "0.23.0"
optional = true
default-features = false

[dependencies.imagesize]
version = "0.13"

[dependencies.kurbo]
version = "0.11"

[dependencies.log]
version = "0.4"

[dependencies.pico-args]
version = "0.5"
features = ["eq-separator"]

[dependencies.roxmltree]
version = "0.20"

[dependencies.rustybuzz]
version = "0.20.1"
optional = true

[dependencies.simplecss]
version = "0.2"

[dependencies.siphasher]
version = "1.0"

[dependencies.strict-num]
version = "0.1.1"

[dependencies.svgtypes]
version = "0.15.3"

[dependencies.tiny-skia-path]
version = "0.11.4"

[dependencies.unicode-bidi]
version = "0.3"
optional = true

[dependencies.unicode-script]
version = "0.5"
optional = true

[dependencies.unicode-vo]
version = "0.1"
optional = true

[dependencies.xmlwriter]
version = "0.1"

[dev-dependencies.once_cell]
version = "1.5"
