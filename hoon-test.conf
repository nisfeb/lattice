# hoon-test-kit: what the Hoon suites build, and where it goes on the test
# desk. Sourced by bash and parsed by python, so plain KEY="value" lines only.
# Paths are relative to this file. See scripts/hoon-test-kit/README.md.

DESK=lattice-test

# the libs the suites cover. None imports another lib, so clay builds them
# as they are and each lands at lib/<name>.hoon
LIBS="code/lib/lattice-clip.hoon code/lib/lattice-gmi.hoon code/lib/lattice-keys.hoon code/lib/lattice-know.hoon code/lib/lattice-md.hoon code/lib/lattice-pg.hoon code/lib/lattice-pub.hoon code/lib/lattice-share.hoon code/lib/lattice-sign.hoon code/lib/lattice-urls.hoon code/lib/lattice-quiz.hoon code/lib/lattice-fuzz.hoon"

# every *.hoon here lands in tests/lib/
TESTS=tests/lib
