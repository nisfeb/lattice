name: nightly

# Heavier suites that need a running ship. Not PR-gating: scheduled + manual.
# Configure repo secrets to enable them (jobs no-op when unset):
#   LATTICE_URL         e.g. https://test-ship.example.com
#                       ⚠ point this at a HARNESS ship, never production.
#                       The matrices write and delete scratch pages/memories.
#   LATTICE_CODE        the ship's +code (e2e mints its own cookie from it)
#   LATTICE_PEER_SHIP   (optional) e.g. ~tyr, for the cross-ship fetch test
#   LATTICE_MCP_COOKIE  "urbauth-~ship=0v…" session cookie, used by the Hoon
#                       test runner and the three integration matrices. A ship
#                       restart expires it. Re-set the secret when that happens.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

jobs:
  e2e:
    name: e2e — HTTP round-trip vs a live ship
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_CODE: ${{ secrets.LATTICE_CODE }}
      LATTICE_PEER_SHIP: ${{ secrets.LATTICE_PEER_SHIP }}
    steps:
      - uses: actions/checkout@v4
      - name: e2e.sh
        if: ${{ env.LATTICE_URL != '' }}
        run: ./scripts/e2e.sh
      - name: skipped
        if: ${{ env.LATTICE_URL == '' }}
        run: echo "LATTICE_URL secret not set — skipping e2e."

  nexus-tests:
    name: nexus — Hoon unit tests via dojo -test
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      # The in-ball run_tests tool 500s on current grubbery builds, so drive
      # the dojo -test thread per test file instead. ok=%.y is the pass signal
      # (per-test detail goes to the pier's terminal, which CI can't see).
      # Assumes the ship runs grubbery with the lattice overlay synced.
      - name: dojo -test per test file
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          set -uo pipefail
          fail=0
          for f in grubbery-overlay/tests/lib/*.hoon; do
            name=$(basename "$f" .hoon)
            body=$(python3 - "$name" <<'PY'
          import json, sys
          cmd = "-test /=grubbery=/tests/lib/" + sys.argv[1] + " ~"
          print(json.dumps({"jsonrpc":"2.0","id":1,"method":"tools/call",
            "params":{"name":"run_dojo","arguments":{"command":cmd}}}))
          PY
          )
            out=$(curl -s -m 550 -X POST "$LATTICE_URL/grubbery/mcp" \
              -H "Cookie: $LATTICE_MCP_COOKIE" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d "$body" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("result",{}).get("content",[{}])[0].get("text",""))')
            if printf '%s' "$out" | grep -q 'ok=%.y'; then
              echo "  ok   - $name"
            else
              echo "  FAIL - $name: $(printf '%s' "$out" | head -c 200)"
              fail=1
            fi
          done
          exit "$fail"
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping nexus unit tests."

  api-matrix:
    name: api — HTTP route matrix
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: api-matrix.sh
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          printf '%s' "$LATTICE_MCP_COOKIE" > /tmp/ship-cookie
          LATTICE_COOKIE=/tmp/ship-cookie ./scripts/api-matrix.sh
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping the api matrix."

  mcp-matrix:
    name: mcp — knowledge-tool matrix
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: mcp-matrix.sh
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          printf '%s' "$LATTICE_MCP_COOKIE" > /tmp/ship-cookie
          LATTICE_COOKIE=/tmp/ship-cookie ./scripts/mcp-matrix.sh
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping the mcp matrix."

  ui-boot:
    name: ui — boot UX + mobile defaults
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: ui-boot.mjs
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core
          printf '%s' "$LATTICE_MCP_COOKIE" > /tmp/ship-cookie
          LATTICE_COOKIE=/tmp/ship-cookie CHROME="$(command -v google-chrome)" \
            node scripts/ui-boot.mjs
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping ui-boot."

  ui-perf:
    name: ui — request counts (perf contract)
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: ui-perf.mjs
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core
          printf '%s' "$LATTICE_MCP_COOKIE" > /tmp/ship-cookie
          LATTICE_COOKIE=/tmp/ship-cookie CHROME="$(command -v google-chrome)" \
            node scripts/ui-perf.mjs
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping ui-perf."

  ui-acl-prefs:
    name: ui — typography, ACL pane, banlist
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: ui-acl-prefs.mjs
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core
          printf '%s' "$LATTICE_MCP_COOKIE" > /tmp/ship-cookie
          LATTICE_COOKIE=/tmp/ship-cookie CHROME="$(command -v google-chrome)" \
            node scripts/ui-acl-prefs.mjs
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping ui-acl-prefs."

  fuzz-api:
    name: api — hostile-input fuzz
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: fuzz-api.mjs --quick
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          printf '%s' "$LATTICE_MCP_COOKIE" > /tmp/ship-cookie
          LATTICE_COOKIE=/tmp/ship-cookie node scripts/fuzz-api.mjs --quick
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping fuzz-api."

  ui-offline:
    name: ui — offline queue + replay
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: ui-offline.mjs
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core
          printf '%s' "$LATTICE_MCP_COOKIE" > /tmp/ship-cookie
          LATTICE_COOKIE=/tmp/ship-cookie CHROME="$(command -v google-chrome)" \
            node scripts/ui-offline.mjs
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping ui-offline."

  ui-matrix:
    name: ui — headless-browser matrix
    runs-on: ubuntu-latest
    env:
      LATTICE_URL: ${{ secrets.LATTICE_URL }}
      LATTICE_MCP_COOKIE: ${{ secrets.LATTICE_MCP_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: ui-matrix.mjs
        if: ${{ env.LATTICE_URL != '' && env.LATTICE_MCP_COOKIE != '' }}
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core
          printf '%s' "$LATTICE_MCP_COOKIE" > /tmp/ship-cookie
          LATTICE_COOKIE=/tmp/ship-cookie CHROME="$(command -v google-chrome)" \
            node scripts/ui-matrix.mjs
      - name: skipped
        if: ${{ env.LATTICE_URL == '' || env.LATTICE_MCP_COOKIE == '' }}
        run: echo "ship/cookie secrets not set — skipping the ui matrix."
