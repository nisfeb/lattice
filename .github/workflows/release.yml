name: release

# Build the desktop app for every supported platform and attach the bundles to
# a GitHub release. Triggered by a version tag (v1.2.3), or by hand.
#
# Windows is deliberately absent. It is not an oversight and not a TODO in this
# file. The app depends on lattice-fs, which mounts through `fuser`, and fuser
# is unix-only. The crate does not compile on Windows at all. Shipping a
# Windows build means writing a WinFsp backend for the Projection trait first
# (see desktop/README.md). A job here would only fail loudly every release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the jobs that create the release or upload
# assets into it (create-release, build) get contents: write.
permissions:
  contents: read

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: the latter moves to
# Ubuntu 26 on 2026-10-19, and the desktop jobs install GTK, WebKit and FUSE
# packages by name. Move to 26 deliberately, after a trial run.
jobs:
  # A tag that disagrees with the version tauri stamps into the bundles would
  # ship "lattice 0.1.0" from a tag called v0.4.0. Wrong in the filename, the
  # About box and the .deb metadata, and invisible until someone reports it.
  # Fail before spending 20 minutes of matrix build time.
  verify:
    name: version + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: tag matches tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./desktop/tauri.conf.json').version")
          echo "tag=$tag  tauri.conf.json=$conf"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag does not match desktop/tauri.conf.json version $conf — bump the config, or retag" >&2
            exit 1
          fi
      # Tag pushes do not run ci.yml (it gates on branches), so a release could
      # otherwise ship code no test ever saw.
      - name: build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev
      - name: cargo test — lattice-fs
        working-directory: lattice-fs-rs
        run: cargo test
      - name: cargo test — desktop
        working-directory: desktop
        run: cargo test
      - name: the served UI artifact is current
        run: |
          node scripts/build-ui.mjs
          git diff --exit-code code/nex/lattice/ui-app/app.js

  # ONE release, made once. Each of the three build jobs used to run
  # "find the draft release for this tag, or create it" concurrently, and
  # v0.8.0-rc6 came out as TWO releases on the same tag with the artifacts
  # split between them. The run still reported success, and the Linux build
  # (the one most people need) was on the release nobody was looking at.
  #
  # Creating it here and handing the builders an id removes the race instead
  # of narrowing it.
  create-release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # creates the draft release
    outputs:
      release_id: ${{ steps.mk.outputs.id }}
    steps:
      - name: create the draft release
        id: mk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('untagged-{0}', github.sha) }}
          #  a hand-run build is never a real release: always a prerelease
          PRE: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          body=$(cat <<'BODY'
          Desktop builds of the lattice client.

          - **Linux**: `.deb` or `.AppImage` (x86_64). Needs `fuse3` for mounting.
          - **macOS**: `.dmg` for Apple Silicon and Intel, signed and
            notarized. Needs [macFUSE](https://macfuse.github.io) for
            mounting.

          Each platform's `SHA256SUMS-*.txt` lists its files. To check a
          download came from this repository's release workflow, run
          `gh attestation verify <file> -R nisfeb/lattice`.

          Windows is not built: mounting needs a WinFsp backend that does not
          exist yet — see `desktop/README.md`.
          BODY
          )
          #  reuse an existing draft for this tag rather than adding another,
          #  so a re-run does not recreate the duplicate this job exists to stop
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                 --jq "[.[] | select(.tag_name==\"${TAG}\")] | first | .id // empty")
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                   -f tag_name="${TAG}" \
                   -f target_commitish="${GITHUB_SHA}" \
                   -f name="lattice ${TAG}" \
                   -F draft=true \
                   -F prerelease="${PRE}" \
                   -f body="$body" --jq .id)
            echo "created release $id for ${TAG}"
          else
            echo "reusing existing release $id for ${TAG}"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, create-release]
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write      # tauri-action uploads the bundles into the release
      id-token: write      # the provenance attestation's signing identity
      attestations: write  # and storing it on the repository
    strategy:
      fail-fast: false     # one platform failing should not hide the others
      matrix:
        include:
          # 22.04, not latest: the glibc a bundle is built against is the
          # OLDEST it runs on, so building on the newest ubuntu quietly drops
          # support for every still-supported distro below it.
          - os: ubuntu-22.04
            label: linux-x86_64 (deb + appimage)
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            label: macos-aarch64 (dmg)
            target: aarch64-apple-darwin
          # Cross-compiled on the SAME arm64 runner rather than on macos-13.
          # In v0.8.0-rc1 the macos-13 job sat queued for hours and never
          # started (GitHub's Intel macOS capacity is scarce), so depending on
          # it means never shipping an Intel build. Apple Silicon hosts
          # x86_64-apple-darwin fine, and macFUSE ships universal libraries, so
          # the link works.
          - os: macos-14
            label: macos-x86_64 (dmg, cross from arm64)
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No rust-cache here. Push-to-main CI runs npm and test code and
      # saves the same default-branch cache, so a release built from it
      # could link whatever that code left in target/ (security audit
      # run-1). A release builds clean, and slower. The lockfile must be
      # current, so cargo cannot resolve anew.
      - name: lockfile is current
        run: cargo fetch --locked --manifest-path desktop/Cargo.toml

      - name: linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libxdo-dev libssl-dev file

      # macFUSE supplies fuse.pc. fuser's BUILD SCRIPT probes pkg-config for
      # `fuse` even with default-features = false, so this is required to
      # compile at all. The Linux job only worked because libfuse3-dev is in
      # its apt list. Removing this on the theory that default-features = false
      # meant no build-time dependency is exactly how the first v0.8.0-rc1 run
      # failed: "The system library `fuse` required by crate `fuser` was not
      # found." The kext never has to load. Only the headers are needed.
      - name: macfuse (fuse.pc for fuser's build script)
        if: runner.os == 'macOS'
        run: |
          brew install --cask macfuse
          pkg-config --exists fuse && echo "fuse.pc found" || {
            echo "::error::macFUSE installed but fuse.pc is not on the pkg-config path" >&2
            exit 1
          }

      # Signing and notarization. The secrets go into the environment only
      # when they exist, because an empty APPLE_CERTIFICATE makes tauri try
      # to import it and fail (see the note on the build step). A tagged
      # release without them fails here instead, so it never ships unsigned
      # by accident. A hand-run build without them stays unsigned.
      - name: macos signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ID: ${{ secrets.APPLE_ID }}
          ID_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::no APPLE_CERTIFICATE secret, and a tagged release must be signed" >&2
              exit 1
            fi
            echo "no APPLE_CERTIFICATE secret, so this hand-run build is unsigned"
            exit 0
          fi
          d="EOF$(openssl rand -hex 8)"
          put() { printf '%s<<%s\n%s\n%s\n' "$1" "$d" "$2" "$d" >> "$GITHUB_ENV"; }
          put APPLE_CERTIFICATE "$CERT"
          put APPLE_CERTIFICATE_PASSWORD "$CERT_PASSWORD"
          put APPLE_SIGNING_IDENTITY "$IDENTITY"
          if [ -n "$API_KEY" ]; then
            p8="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
            printf '%s\n' "$API_KEY_P8" > "$p8"
            put APPLE_API_ISSUER "$API_ISSUER"
            put APPLE_API_KEY "$API_KEY"
            put APPLE_API_KEY_PATH "$p8"
          elif [ -n "$ID" ]; then
            put APPLE_ID "$ID"
            put APPLE_PASSWORD "$ID_PASSWORD"
            put APPLE_TEAM_ID "$TEAM_ID"
          else
            echo "::error::APPLE_CERTIFICATE is set but nothing to notarize with: set APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_P8, or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID" >&2
            exit 1
          fi

      - name: build and upload
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pkg-config refuses to answer when target != host unless told it is
          # allowed, so the Intel-from-arm64 build died in fuser's build script
          # before compiling a line. Safe here specifically because macFUSE
          # ships UNIVERSAL libraries. The .pc it finds describes a binary
          # that really does contain x86_64. No effect on a native build.
          PKG_CONFIG_ALLOW_CROSS: '1'
          # No APPLE_* vars here on purpose. `${{ secrets.X }}` for a secret
          # that does not exist renders an EMPTY STRING, which is not the same
          # as not setting the variable. tauri saw APPLE_CERTIFICATE present,
          # tried to import it, and the first v0.8.0-rc1 macOS build died with
          # "failed to run command security import". The signing step above
          # sets them only when they exist.
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
          # upload into the release create-release already made. No tagName
          # or releaseName here on purpose: giving the action those is what
          # made it go looking for a release to create.
          #
          # It stays a DRAFT until a human publishes it: a release is
          # outward-facing and irreversible once people have the URL.
          releaseId: ${{ needs.create-release.outputs.release_id }}

      # SHA-256 sums of what this job built, attached to the release, and a
      # signed build provenance attestation for each file. Anyone can check
      # a download with `gh attestation verify <file> -R nisfeb/lattice`.
      - name: checksums
        id: sums
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RID: ${{ needs.create-release.outputs.release_id }}
          LABEL: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sums="$RUNNER_TEMP/SHA256SUMS-$LABEL.txt"
          node -e 'for (const p of JSON.parse(process.env.PATHS)) console.log(p)' |
            while IFS= read -r f; do
              [ -f "$f" ] && (cd "$(dirname "$f")" && shasum -a 256 "$(basename "$f")")
            done > "$sums"
          cat "$sums"
          [ -s "$sums" ] || { echo "::error::no bundle files to sum" >&2; exit 1; }
          gh api -X POST -H 'content-type: text/plain' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$(basename "$sums")" \
            --input "$sums" > /dev/null
          echo "file=$sums" >> "$GITHUB_OUTPUT"

      - name: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.sums.outputs.file }}
