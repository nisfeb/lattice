name: release

# Build the desktop app for every supported platform and attach the bundles to
# a GitHub release. Triggered by a version tag (v1.2.3), or by hand.
#
# Windows is deliberately absent. It is not an oversight and not a TODO in this
# file. The app depends on lattice-fs, which mounts through `fuser`, and fuser
# is unix-only. The crate does not compile on Windows at all. Shipping a
# Windows build means writing a WinFsp backend for the Projection trait first
# (see desktop/README.md). A job here would only fail loudly every release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'create the release as a draft'
        type: boolean
        default: true

permissions:
  contents: write        # needed to create the release and upload assets

jobs:
  # A tag that disagrees with the version tauri stamps into the bundles would
  # ship "lattice 0.1.0" from a tag called v0.4.0. Wrong in the filename, the
  # About box and the .deb metadata, and invisible until someone reports it.
  # Fail before spending 20 minutes of matrix build time.
  verify:
    name: version + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./desktop/tauri.conf.json').version")
          echo "tag=$tag  tauri.conf.json=$conf"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag does not match desktop/tauri.conf.json version $conf — bump the config, or retag" >&2
            exit 1
          fi
      # Tag pushes do not run ci.yml (it gates on branches), so a release could
      # otherwise ship code no test ever saw.
      - name: build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev
      - name: cargo test — lattice-fs
        working-directory: lattice-fs-rs
        run: cargo test
      - name: cargo test — desktop
        working-directory: desktop
        run: cargo test
      - name: the served UI artifact is current
        run: |
          node scripts/build-ui.mjs
          git diff --exit-code grubbery-overlay/nex/lattice/ui-app/app.js

  # ONE release, made once. Each of the three build jobs used to run
  # "find the draft release for this tag, or create it" concurrently, and
  # v0.8.0-rc6 came out as TWO releases on the same tag with the artifacts
  # split between them. The run still reported success, and the Linux build
  # (the one most people need) was on the release nobody was looking at.
  #
  # Creating it here and handing the builders an id removes the race instead
  # of narrowing it.
  create-release:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.mk.outputs.id }}
    steps:
      - name: create the draft release
        id: mk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('untagged-{0}', github.sha) }}
          PRE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          body=$(cat <<'BODY'
          Desktop builds of the lattice client.

          - **Linux**: `.deb` or `.AppImage` (x86_64). Needs `fuse3` for mounting.
          - **macOS**: `.dmg` for Apple Silicon and Intel. Needs
            [macFUSE](https://macfuse.github.io) for mounting. Unsigned
            builds need right-click → Open the first time.

          Windows is not built: mounting needs a WinFsp backend that does not
          exist yet — see `desktop/README.md`.
          BODY
          )
          #  reuse an existing draft for this tag rather than adding another,
          #  so a re-run does not recreate the duplicate this job exists to stop
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                 --jq "[.[] | select(.tag_name==\"${TAG}\")] | first | .id // empty")
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                   -f tag_name="${TAG}" \
                   -f name="lattice ${TAG}" \
                   -F draft=true \
                   -F prerelease="${PRE}" \
                   -f body="$body" --jq .id)
            echo "created release $id for ${TAG}"
          else
            echo "reusing existing release $id for ${TAG}"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, create-release]
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one platform failing should not hide the others
      matrix:
        include:
          # 22.04, not latest: the glibc a bundle is built against is the
          # OLDEST it runs on, so building on the newest ubuntu quietly drops
          # support for every still-supported distro below it.
          - os: ubuntu-22.04
            label: linux-x86_64 (deb + appimage)
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            label: macos-aarch64 (dmg)
            target: aarch64-apple-darwin
          # Cross-compiled on the SAME arm64 runner rather than on macos-13.
          # In v0.8.0-rc1 the macos-13 job sat queued for hours and never
          # started (GitHub's Intel macOS capacity is scarce), so depending on
          # it means never shipping an Intel build. Apple Silicon hosts
          # x86_64-apple-darwin fine, and macFUSE ships universal libraries, so
          # the link works.
          - os: macos-14
            label: macos-x86_64 (dmg, cross from arm64)
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libxdo-dev libssl-dev file

      # macFUSE supplies fuse.pc. fuser's BUILD SCRIPT probes pkg-config for
      # `fuse` even with default-features = false, so this is required to
      # compile at all. The Linux job only worked because libfuse3-dev is in
      # its apt list. Removing this on the theory that default-features = false
      # meant no build-time dependency is exactly how the first v0.8.0-rc1 run
      # failed: "The system library `fuse` required by crate `fuser` was not
      # found." The kext never has to load. Only the headers are needed.
      - name: macfuse (fuse.pc for fuser's build script)
        if: runner.os == 'macOS'
        run: |
          brew install --cask macfuse
          pkg-config --exists fuse && echo "fuse.pc found" || {
            echo "::error::macFUSE installed but fuse.pc is not on the pkg-config path" >&2
            exit 1
          }

      - name: build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pkg-config refuses to answer when target != host unless told it is
          # allowed, so the Intel-from-arm64 build died in fuser's build script
          # before compiling a line. Safe here specifically because macFUSE
          # ships UNIVERSAL libraries. The .pc it finds describes a binary
          # that really does contain x86_64. No effect on a native build.
          PKG_CONFIG_ALLOW_CROSS: '1'
          # No APPLE_* vars here on purpose. `${{ secrets.X }}` for a secret
          # that does not exist renders an EMPTY STRING, which is not the same
          # as not setting the variable. tauri saw APPLE_CERTIFICATE present,
          # tried to import it, and the first v0.8.0-rc1 macOS build died with
          # "failed to run command security import". Passing nothing produces
          # an unsigned bundle, which is the intended default.
          #
          # To sign later, add the block below AND the matching repo secrets.
          # Both, or the same failure returns:
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
          #   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
          # upload into the release create-release already made. No tagName
          # or releaseName here on purpose: giving the action those is what
          # made it go looking for a release to create.
          #
          # It stays a DRAFT until a human publishes it: a release is
          # outward-facing and irreversible once people have the URL.
          releaseId: ${{ needs.create-release.outputs.release_id }}
