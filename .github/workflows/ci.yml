name: CI

# PR-gating checks that need no ship: the Rust FUSE client's unit tests and
# static checks on the web client + scripts. Ship-dependent suites (Hoon unit
# tests, the ui/api/mcp integration matrices) run in nightly.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fs-client:
    name: lattice-fs — cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fuse build deps
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      - name: cargo test
        working-directory: lattice-fs-rs
        run: cargo test --release
      #  Lints are a ratchet or they are nothing: the findings this removed
      #  come straight back the first time nobody runs it by hand.
      - name: clippy
        working-directory: lattice-fs-rs
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

  desktop:
    name: desktop — cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tauri pulls the webkit stack in at COMPILE time, so the deps are needed
      # even though every test here is pure logic (pier detection, ship-name
      # shape, config round-trip, eyre binding classification).
      - name: tauri + fuse build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev
      # A tauri command is registered in three places and missing any one of
      # them denies it at runtime with "not allowed. Command not found". That
      # has shipped three times here: save_vault, the whole offline queue, and
      # the pandoc converter. cargo test cannot see it, because the mismatch is
      # between rust, a build script and json.
      - name: tauri commands are registered everywhere
        run: node scripts/desktop-commands.mjs
      # The page-kind <-> extension table lives in three places (two JS, one
      # Rust) that cannot see each other, and it has drifted apart three
      # times already, each one a shipped data-loss bug. See
      # kind-parity.mjs's own header for the list. cargo test cannot catch
      # it, same reason as the step above: the mismatch is across languages.
      - name: page-kind <-> extension tables agree everywhere
        run: node scripts/kind-parity.mjs
      - name: cargo test
        working-directory: desktop
        run: cargo test
      - name: clippy
        working-directory: desktop
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

  nix:
    name: nix — flake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # No magic-nix-cache: it authenticates against FlakeHub and hard-fails
      # without an account. Builds are uncached and slower. Correctness first.
      # `nix flake check` also evaluates the devShells, so a typo'd package
      # attribute fails here rather than the first time someone runs it.
      - name: flake evaluates
        run: nix flake check --no-build --all-systems
      - name: build the package
        run: nix build .#lattice-desktop --print-build-logs
      - name: the built binary is the one we think it is
        run: |
          test -x result/bin/lattice-desktop
          echo "built: $(readlink -f result)"

  static:
    name: web client + scripts — static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UI builds and the served artifact is current
        run: |
          node scripts/build-ui.mjs
          git diff --exit-code grubbery-overlay/nex/lattice/ui-app/app.js
          node --check grubbery-overlay/nex/lattice/ui-app/app.js
      # every suite, not just ui-matrix: a syntax error in one that CI never
      # parsed is a suite that silently stops testing anything.
      - name: test scripts parse
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done
      # Every pure (non-browser) harness, found by glob rather than a hand-kept
      # list: a new *.mjs unit test nobody remembers to add here is a suite CI
      # silently never runs.
      #
      # A harness counts as a browser suite if it names puppeteer OR imports
      # scripts/lib/harness.mjs. Both halves are load-bearing: the shared helper
      # now owns the launch, so the harnesses that use it stopped naming
      # puppeteer at all, and a puppeteer-only filter swept two ship-dependent
      # suites into this step, where they failed for want of a ship.
      # The ship-free browser suite runs in the next step, the ship-bound ones
      # in nightly.yml. fast-check is for the property harness.
      - name: pure-function unit + property tests
        run: |
          npm i --no-save --no-audit --no-fund fast-check
          for f in scripts/ui-*.mjs; do
            grep -qE 'puppeteer|lib/harness\.mjs' "$f" && continue
            echo "--- $(basename "$f") ---"
            node "$f"
          done
      - name: supply chain (licences + bans)
        run: |
          cargo install cargo-deny --locked
          cargo deny --manifest-path lattice-fs-rs/Cargo.toml check licenses bans sources
          cargo deny --manifest-path desktop/Cargo.toml check licenses bans sources
          #  advisories are REPORTED, never fatal: every one today is an
          #  unmaintained transitive of tauri's gtk3 stack, unfixable here.
          cargo deny --manifest-path desktop/Cargo.toml check advisories || true
      # ui-manager loads desktop/ui/manager.html from file:// with a stubbed
      # Tauri, so it is a real browser test that needs NO ship — it gates PRs
      # with the rest here. The ubuntu runner ships google-chrome.
      - name: browser unit test — manager page (no ship)
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core
          CHROME="$(command -v google-chrome)" node scripts/ui-manager.mjs
