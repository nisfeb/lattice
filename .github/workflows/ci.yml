name: CI

# PR-gating checks that need no ship: the Rust FUSE client's unit tests and
# static checks on the web client + scripts. Ship-dependent suites (Hoon unit
# tests, the ui/api/mcp integration matrices) run in nightly.yml.

on:
  pull_request:
  push:
    branches: [main]
  # a branch's run by hand (gh workflow run ci.yml --ref <branch>), for a
  # build question that cannot wait for a PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: the latter moves to
# Ubuntu 26 on 2026-10-19, and the desktop jobs install GTK, WebKit and FUSE
# packages by name. Move to 26 deliberately, after a trial run.
jobs:
  # deny.toml's advisories, licenses, bans and sources, for both Rust crates.
  # A known advisory in a lockfile fails CI instead of waiting to be noticed.
  rust-deps:
    name: rust deps — cargo deny
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate: [lattice-fs-rs, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ${{ matrix.crate }}/Cargo.toml
          command: check

  fs-client:
    name: lattice-fs — cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: fuse build deps
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      #  --release for speed, but with overflow checks: the overflow
      #  regressions (da_extreme_fields_do_not_overflow, da_is_total*, and
      #  cue's atom-length guard) only panic when they are on, and release
      #  turns them off. Without this they pass with their guards deleted.
      - name: cargo test
        working-directory: lattice-fs-rs
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: cargo test --release
      #  Lints are a ratchet or they are nothing: the findings this removed
      #  come straight back the first time nobody runs it by hand.
      - name: clippy
        working-directory: lattice-fs-rs
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

  desktop:
    name: desktop — cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # tauri pulls the webkit stack in at COMPILE time, so the deps are needed
      # even though every test here is pure logic (pier detection, ship-name
      # shape, config round-trip, eyre binding classification).
      - name: tauri + fuse build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev pandoc xvfb clang libclang-dev
      # libmesa's C sources for the urb engine (desktop/.cargo/config.toml)
      - name: urb engine sources
        run: sh desktop/scripts/mesa-deps.sh
      # A tauri command is registered in three places and missing any one of
      # them denies it at runtime with "not allowed. Command not found". That
      # has shipped three times here: save_vault, the whole offline queue, and
      # the pandoc converter. cargo test cannot see it, because the mismatch is
      # between rust, a build script and json.
      - name: tauri commands are registered everywhere
        run: node scripts/desktop-commands.mjs
      # The page-kind <-> extension table lives in three places (two JS, one
      # Rust) that cannot see each other, and it has drifted apart three
      # times already, each one a shipped data-loss bug. See
      # kind-parity.mjs's own header for the list. cargo test cannot catch
      # it, same reason as the step above: the mismatch is across languages.
      - name: page-kind <-> extension tables agree everywhere
        run: node scripts/kind-parity.mjs
      - name: cargo test
        working-directory: desktop
        run: cargo test
      - name: clippy
        working-directory: desktop
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
      # The bridge's token rule is unit-tested, but only a real WebKit shows
      # the token cookie rides on page, SSE and service-worker requests and
      # not on a sandboxed frame or another local process. The app runs under
      # xvfb against a stub ship, so no ship is needed.
      - name: the webview carries the bridge token
        run: |
          # from desktop/: cargo reads .cargo/config.toml (MESA_SYS_DEPS)
          # from the directory it runs in, not from --manifest-path's
          (cd desktop && cargo build)
          scripts/desktop-bridge-check.sh

  # The desktop with its urb engine (urb-fetch's libmesa, docs/superpowers/
  # specs/2026-11-03-desktop-urb-engine-design.md), built for every release
  # target on the release's own runners. libmesa is C23 (-std=gnu23), which
  # ubuntu-22.04's clang 14 and Xcode 15's Apple clang cannot compile, so
  # each gets a newer clang: LLVM 18 on Linux (desktop/scripts/clang-18.sh), Homebrew
  # LLVM on macOS. release.yml takes the same steps.
  engine-build:
    name: desktop + urb engine — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # macos-15, as release.yml: macos-14 stopped running on 2026-11-05
          - os: macos-15
            target: aarch64-apple-darwin
          # cross from arm64, as release.yml builds it
          - os: macos-15
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: clang 18 and the desktop's build deps (linux)
        if: runner.os == 'Linux'
        run: |
          sh desktop/scripts/clang-18.sh
          sudo apt-get install -y libfuse3-dev pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev
      - name: homebrew llvm and macfuse (macos)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          brew install --cask macfuse
          llvm="$(brew --prefix llvm@20)"
          echo "CC_aarch64_apple_darwin=$llvm/bin/clang" >> "$GITHUB_ENV"
          echo "CC_x86_64_apple_darwin=$llvm/bin/clang" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$llvm/lib" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$llvm/bin/clang" >> "$GITHUB_ENV"
          sdk="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          # bindgen's libclang finds neither the SDK nor its own builtin
          # headers (stdbool.h) by itself on a Homebrew LLVM
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $sdk -isystem $("$llvm/bin/clang" -print-resource-dir)/include" >> "$GITHUB_ENV"
      - name: rust target
        run: rustup target add ${{ matrix.target }}
      - name: urb engine sources
        run: sh desktop/scripts/mesa-deps.sh
      - name: build the desktop (release)
        working-directory: desktop
        env:
          # fuser's pkg-config probe on the Intel cross, as release.yml
          PKG_CONFIG_ALLOW_CROSS: '1'
        run: |
          start=$(date +%s)
          cargo build --locked --release --target ${{ matrix.target }}
          echo "built in $(( $(date +%s) - start ))s"
          ls -l target/${{ matrix.target }}/release/lattice-desktop

  nix:
    name: nix — flake build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
      # No magic-nix-cache: it authenticates against FlakeHub and hard-fails
      # without an account. Builds are uncached and slower. Correctness first.
      # `nix flake check` also evaluates the devShells, so a typo'd package
      # attribute fails here rather than the first time someone runs it.
      - name: flake evaluates
        run: nix flake check --no-build --all-systems
      - name: build the package
        run: nix build .#lattice-desktop --print-build-logs
      - name: the built binary is the one we think it is
        run: |
          test -x result/bin/lattice-desktop
          echo "built: $(readlink -f result)"

  # The Writer round-trip harness (plan 2026-11-01-writer-wysiwyg, Corpus).
  # LibreOffice re-saves every corpus file, canon.py compares the saves,
  # and the text and PDF exports must agree. Its own job because
  # LibreOffice is too heavy for the others. The writer core's steps
  # (no-op, scripted edit, lattice reads LibreOffice's save) import
  # ui-src/writer/, so the job installs the ProseMirror packages. The
  # corpus is saved by a newer LibreOffice than Ubuntu ships, so the
  # corpus fixed-point check skips here; the both-sides-through-
  # LibreOffice checks do not.
  writer-roundtrip:
    name: Writer round trip, LibreOffice headless
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: LibreOffice Writer (no GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
          soffice --version
      - name: canon.py is stable across two LibreOffice re-saves
        run: python3 scripts/writer-corpus/canon.py --self-test
      - name: ProseMirror for the writer core
        run: npm ci --prefix scripts --no-audit --no-fund --ignore-scripts
      - name: round-trip harness
        env:
          WRITER_REQUIRE_SOFFICE: "1"
        run: node scripts/writer-roundtrip.mjs
      - name: .odt import and export
        env:
          WRITER_REQUIRE_SOFFICE: "1"
        run: node scripts/writer-odt.mjs

  # Every .hoon file in code/ compiles on a fake ~zod with grubbery, as a
  # ship builds it: dev-deploy.py sends code/ and hoon-build-wait.py asks
  # each file's ?info=1 for its build status. Release 111 shipped an
  # app.hoon that did not build (a nest-fail every text check passed).
  # Booting ~zod and installing grubbery takes most of half an hour, so
  # the stopped pier is cached on the vere, the pill and grubbery's commit.
  hoon-build:
    name: Hoon, code/ compiles on a fake ship
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERE_TAG: vere-v4.6
      PILL_URL: https://bootstrap.urbit.org/urbit-v4.6.pill
      VERE: ${{ github.workspace }}/../vere/vere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: vere and socat
        run: |
          sudo apt-get install -y socat
          mkdir -p "$RUNNER_TEMP/vere" "$(dirname "$VERE")"
          curl -fsSL "https://github.com/urbit/vere/releases/download/$VERE_TAG/linux-x86_64.tgz" |
            tar -xz -C "$RUNNER_TEMP/vere"
          mv "$RUNNER_TEMP"/vere/* "$VERE"
          "$VERE" --version | head -1
      - name: grubbery's commit
        id: grub
        # a failed ls-remote would key the pier cache on an empty commit
        run: |
          sha=$(set -o pipefail; git ls-remote https://github.com/nisfeb/grubbery refs/heads/dist/single-release | cut -c1-12)
          [ -n "$sha" ]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      #  restore and save apart: a failing check must not cost the next
      #  run the base build
      - name: cached ~zod with grubbery
        id: pier
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/hoon-pier
          key: hoon-pier-${{ env.VERE_TAG }}-${{ steps.grub.outputs.sha }}-${{ hashFiles('scripts/hoon-build.sh') }}
      - name: boot ~zod and install grubbery
        if: steps.pier.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/urbit.pill" "$PILL_URL"
          git clone -q --depth 1 --branch dist/single-release \
            https://github.com/nisfeb/grubbery "$RUNNER_TEMP/grubbery"
          PILL="$RUNNER_TEMP/urbit.pill" GRUBBERY="$RUNNER_TEMP/grubbery/desk" \
            scripts/hoon-build.sh base ~/hoon-pier
          rm -f ~/hoon-pier/vere.log
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pier.outputs.cache-hit != 'true'
        with:
          path: ~/hoon-pier
          key: ${{ steps.pier.outputs.cache-primary-key }}
      - name: deploy code/ and check every file built
        run: scripts/hoon-build.sh check ~/hoon-pier
      - name: the ship's log
        if: failure()
        run: tail -100 ~/hoon-pier/vere.log || true

  static:
    name: web client + scripts — static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: UI builds and the served artifact is current
        run: |
          node scripts/build-ui.mjs
          git diff --exit-code code/nex/lattice/ui-app/app.js desktop/ui/settings.js
          node --check code/nex/lattice/ui-app/app.js
          node --check code/nex/lattice/ui-app/settings.js
          node scripts/app-js-size.mjs
      # writer.js is the Writer editor, the one client asset with runtime
      # dependencies (ProseMirror, pinned in scripts/package.json). It is
      # rebuilt and diffed like app.js, with its generated notice file.
      # build-writer.mjs fails over the phase 1 budget (400 KB raw, 130 KB
      # gzipped), and writer-licences.mjs fails on any bundled licence
      # outside MIT, ISC and BSD, or on app.js mentioning ProseMirror.
      - name: writer.js builds, is current, in budget and licence-clean
        run: |
          npm ci --prefix scripts --no-audit --no-fund --ignore-scripts
          node scripts/build-writer.mjs
          git diff --exit-code code/nex/lattice/ui-app/writer.js ui-src/writer/vendor/LICENSES
          node --check code/nex/lattice/ui-app/writer.js
          node scripts/writer-licences.mjs
      # the writer core (tokenizer, model, styles, minimal-diff serializer),
      # pure node: no-op round trips, minimal diffs, style reuse, pairs,
      # hostile files and the 13-large time budget
      - name: writer core unit tests
        run: node scripts/writer-unit.mjs
      # every suite, not just ui-matrix: a syntax error in one that CI never
      # parsed is a suite that silently stops testing anything.
      - name: test scripts parse
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done
          for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f"; done
          for f in scripts/writer-corpus/*.py; do python3 -m py_compile "$f"; done
      # the agent plugins (plugins/): they parse, their manifests are JSON,
      # the Hermes plugin passes its fake-ship check (hermes-plugin-check.py),
      # and the Claude plugin's MCP server answers tools/list
      - name: agent plugins
        run: |
          node --check plugins/claude/server.mjs
          node --check plugins/claude/hooks/lattice-hook.mjs
          node --check plugins/claude/url-rule.mjs
          node --check plugins/claude/quote.mjs
          node --check plugins/claude/hooks/skills-sync.mjs
          node --check plugins/claude/import-skills.mjs
          python3 -m py_compile plugins/hermes/__init__.py
          python3 scripts/hermes-plugin-check.py
          for f in .claude-plugin/marketplace.json plugins/claude/.claude-plugin/plugin.json plugins/claude/.mcp.json plugins/claude/hooks/hooks.json; do python3 -m json.tool "$f" >/dev/null; done
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node plugins/claude/server.mjs | grep -q memory_recall
      # Every pure (non-browser) harness, found by glob rather than a hand-kept
      # list: a new *.mjs unit test nobody remembers to add here is a suite CI
      # silently never runs.
      #
      # A harness counts as a browser suite if it names puppeteer OR imports
      # scripts/lib/harness.mjs. Both halves are load-bearing: the shared helper
      # now owns the launch, so the harnesses that use it stopped naming
      # puppeteer at all, and a puppeteer-only filter swept two ship-dependent
      # suites into this step, where they failed for want of a ship.
      # The ship-free browser suite runs in the next step, the ship-bound ones
      # in nightly.yml. fast-check is for the property harness.
      - name: pure-function unit + property tests
        run: |
          npm ci --prefix scripts --no-audit --no-fund --ignore-scripts
          for f in scripts/ui-*.mjs; do
            grep -qE 'puppeteer|lib/harness\.mjs' "$f" && continue
            echo "--- $(basename "$f") ---"
            node "$f"
          done
          node scripts/gate-claim-check.mjs
      # The desk's own closure: every marc and import the code names is in
      # code/ (a guest install resolves nothing outside it), and bill.json
      # names only nexuses that exist. code-closure caught the rise-later
      # port's missing timer marks, which ~wex's trusted install hid.
      - name: desk closure, bill, fiber depths and loader rows
        run: |
          python3 scripts/code-closure.py code
          python3 scripts/bill-check.py code
          #  every road-building arm is reachable at one depth only, or its
          #  road climbs past the root and the fiber crash-loops
          python3 scripts/depth-check.py code/nex/lattice/app.hoon
          #  a healthy ship prints nothing: every print goes through +say
          #  at a level (docs/logging.md)
          python3 scripts/quiet-check.py code
          #  every grub the app writes has a covering on-load row: the
          #  loader drops anything uncovered on every reload
          python3 scripts/onload-check.py code/nex/lattice/app.hoon
      #  every system road the app reaches is declared in weir.json, in the
      #  category it is reached in. On a desk install an undeclared road is
      #  a veto that parks the fiber; sharing with ships shipped that way.
      #  Checked against the fiberio users actually run.
      - name: weir declares every road reached
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fiberio.hoon" \
            https://raw.githubusercontent.com/nisfeb/grubbery/dist/single-release/desk/lib/fiberio.hoon
          python3 scripts/weir-check.py code/nex/lattice/app.hoon --io "$RUNNER_TEMP/fiberio.hoon"
      # ui-manager loads desktop/ui/manager.html from file:// with a stubbed
      # Tauri, so it is a real browser test that needs NO ship — it gates PRs
      # with the rest here. The ubuntu runner ships google-chrome.
      - name: browser unit test — manager page (no ship)
        run: |
          npm ci --prefix scripts --no-audit --no-fund --ignore-scripts
          CHROME="$(command -v google-chrome)" node scripts/ui-manager.mjs
      # ui-reader-loading serves reader.js and reader.css from a stand-in
      # for the shipless reader's loopback, so it needs no ship either.
      - name: browser unit test - reader loading line (no ship)
        run: CHROME="$(command -v google-chrome)" node scripts/ui-reader-loading.mjs
