name: CI

# PR-gating checks that need no ship: the Rust FUSE client's unit tests and
# static checks on the web client + scripts. Ship-dependent suites (Hoon unit
# tests, the ui/api/mcp integration matrices) run in nightly.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fs-client:
    name: lattice-fs — cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fuse build deps
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      - name: cargo test
        working-directory: lattice-fs-rs
        run: cargo test --release

  desktop:
    name: desktop — cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tauri pulls the webkit stack in at COMPILE time, so the deps are needed
      # even though every test here is pure logic (pier detection, ship-name
      # shape, config round-trip, eyre binding classification).
      - name: tauri + fuse build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev
      - name: cargo test
        working-directory: desktop
        run: cargo test

  nix:
    name: nix — flake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # No magic-nix-cache: it authenticates against FlakeHub and hard-fails
      # without an account. Builds are uncached and slower; correctness first.
      # `nix flake check` also evaluates the devShells, so a typo'd package
      # attribute fails here rather than the first time someone runs it.
      - name: flake evaluates
        run: nix flake check --no-build --all-systems
      - name: build the package
        run: nix build .#lattice-desktop --print-build-logs
      - name: the built binary is the one we think it is
        run: |
          test -x result/bin/lattice-desktop
          echo "built: $(readlink -f result)"

  static:
    name: web client + scripts — static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UI builds and the served artifact is current
        run: |
          node scripts/build-ui.mjs
          git diff --exit-code grubbery-overlay/nex/lattice/ui-app/app.js
          node --check grubbery-overlay/nex/lattice/ui-app/app.js
      # every suite, not just ui-matrix: a syntax error in one that CI never
      # parsed is a suite that silently stops testing anything.
      - name: test scripts parse
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done
