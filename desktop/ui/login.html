<!doctype html>
<meta charset="utf-8">
<title>lattice — connecting…</title>
<body style="font: 14px system-ui; margin: 2rem">connecting…
<script>
  // A top-level form POST to eyre's /~/login is exempt from CORS; eyre sets
  // the webview's own session cookie and the `redirect` field sends us on to
  // the ship-served lattice app.
  const invoke = window.__TAURI__.core.invoke;
  (async () => {
    const pending = await invoke('take_login');
    if (pending) {
      const [url, code] = pending;
      const f = document.createElement('form');
      f.method = 'post';
      f.action = url + '/~/login';
      for (const [k, v] of [['password', code], ['redirect', '/apps/lattice']]) {
        const i = document.createElement('input');
        i.type = 'hidden'; i.name = k; i.value = v;
        f.appendChild(i);
      }
      document.body.appendChild(f);
      f.submit();
    } else {
      // relaunch: webview cookie usually still valid — go straight in.
      // If it expired, eyre shows its own login page; or reconnect from the manager.
      const cfg = await invoke('get_config');
      location.href = cfg.url + '/apps/lattice';
    }
  })();
</script>
