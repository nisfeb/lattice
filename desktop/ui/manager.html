<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lattice settings</title>
<!-- The ship page's theme, as it last told the shell (set_theme), painted
     from this page's own copy before anything else, the way +pwa-head
     paints the ship's documents. The status call below refreshes it. -->
<script>try{var v=JSON.parse(localStorage.latThemeVars||"{}"),s=document.documentElement.style;for(var k in v)s.setProperty(k,v[k])}catch(e){}</script>
<!-- The one look and tab model of lattice's settings, shared with the ship's
     Settings page: a copy of code/nex/lattice/ui-app/settings.js, written
     by scripts/build-ui.mjs. This page has to work with no node at all, so
     it cannot load the ship's. -->
<script src="settings.js"></script>
<style>
  /* only what this page has and the ship's Settings does not; the rest,
     the This computer panels included, is settings.js */
  * { box-sizing: border-box; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
</style>
<main>
  <!-- Leaving this page is a CLOSE, in the place and the wording the in-app
       panes use (access control, search, comments, conflicts all put a plain
       "close" at the end of their header bar, and all close on Escape).

       ALWAYS on screen, from the first paint. The exit must never wait on
       the network: the connection check is a real round-trip to the ship.
       go_home refuses cleanly when no ship is configured ("connect to a
       ship first"), and that message is surfaced instead of navigating. -->
  <div class="st-top top">
    <h1>Settings</h1>
    <button id="close">close</button>
  </div>

  <!-- One settings surface with the ship's Settings page: the same tabs in
       the same look. This page is where they live with no node, the first
       run; with one, the editor's Settings tab has them all. "Lattice" is
       the ship page's Settings, which go_home opens at the tab named (shown
       once a ship is configured, since without one there is nothing to
       open). -->
  <div class="st">
    <nav class="st-nav" aria-label="Settings sections">
      <div class="st-group" id="ship-tabs" hidden>
        <div class="st-gh">Lattice</div>
        <a class="st-tab" href="#" data-go="appearance">Appearance</a>
        <a class="st-tab" href="#" data-go="editing">Editor</a>
        <a class="st-tab" href="#" data-go="keys">Agent keys</a>
        <a class="st-tab" href="#" data-go="data">Data and backup</a>
        <a class="st-tab" href="#" data-go="clipping">Clipping</a>
        <a class="st-tab" href="#" data-go="advanced">Advanced</a>
      </div>
    </nav>
    <!-- the This computer panels: settings.js (latSettings.desk below),
         which the ship's Settings tab shows in the desktop too -->
    <div class="st-body"></div>
  </div>
</main>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);
  // The ship page's theme, which it tells the shell (set_theme) and status
  // hands back: the same CSS variables theme.js puts on the ship's <html>,
  // kept here in this origin's own localStorage so the next load paints
  // with them at once (the line at the top). Empty is lattice's default,
  // light or dark as the system is.
  //
  // The window's native chrome (the GTK menubar) follows the window theme,
  // not the page's, so the page's light or dark goes to the window too.
  // This page sends no variables, which leaves the kept ones alone.
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => {
    const cs = document.documentElement.style.getPropertyValue('color-scheme');
    return cs ? cs === 'dark' : mq.matches;
  };
  const tellTheme = () => { invoke('set_theme', { dark: isDark() }).catch(() => {}); };
  function wearTheme(v) {
    const s = document.documentElement.style;
    for (const k of Array.from(s)) if (k === 'color-scheme' || k.startsWith('--')) s.removeProperty(k);
    for (const k in v || {}) s.setProperty(k, v[k]);
    try { localStorage.latThemeVars = JSON.stringify(v || {}); } catch {}
    tellTheme();
  }
  tellTheme();
  mq.addEventListener('change', tellTheme);

  // The Lattice tabs are the ship page's Settings: go_home opens the editor
  // with that tab in front. A refusal (no ship) is shown like close's.
  window.stGo = (tab) => invoke('go_home', { settings: tab }).catch((e) => {
    const s = $('connect-status');
    s.textContent = String(e); s.className = 'err';
  });

  // Connection, Files and Scheduled backups: the same panels the ship's
  // Settings shows in the desktop (settings.js). Here they are the shell's
  // own page, so nothing asks again, and the ship-software section, which
  // only a ship missing lattice needs, is here alone.
  latSettings.desk({
    invoke,
    listen: window.__TAURI__.event.listen,
    shown: (ship) => { $('ship-tabs').hidden = !ship; },
    status: (s) => { if (s.theme) wearTheme(s.theme); },
  });

  // Close never waits on anything. go_home navigates when a ship is
  // configured and refuses with a message when none is; that message lands
  // in the form's status line rather than vanishing into a rejected promise.
  const closeManager = () => invoke('go_home').catch((e) => {
    const s = $('connect-status');
    s.textContent = String(e); s.className = 'err';
  });
  $('close').onclick = closeManager;
  // Escape closes too, matching the in-app dialogs — same non-blocking rule.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeManager();
  });
</script>
