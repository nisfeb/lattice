<!doctype html>
<meta charset="utf-8">
<title>lattice — connection &amp; mounts</title>
<style>
  /* mirrors the lattice app's flat green identity (ui-app/index.html) */
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --green: #4a7c59; --green-deep: #3a6347;
    --bg: #fafafa; --text: #1a1a1a; --muted: #8a8a8a;
    --border: #8886; --border-soft: #8883; --surface: #8881;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a1a; --text: #e6e6e6; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1rem; margin: 2rem 0 .6rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  input, button {
    font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  }
  input { width: 100%; margin-bottom: .5rem; background: transparent; }
  input:focus { outline: none; border-color: var(--green); }
  button { cursor: pointer; }
  button:hover { border-color: var(--green); }
  button.primary { background: var(--green); border-color: var(--green-deep); color: #fff; }
  button.primary:hover { background: var(--green-deep); }
  .row { display: flex; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  .err { color: #c0392b; white-space: pre-wrap; }
  ul { list-style: none; padding: 0; margin: .5rem 0; }
  li { display: flex; gap: 8px; align-items: center; padding: 8px 0;
    border-bottom: 1px solid var(--border-soft); }
  li code { flex: 1; font-size: .9em; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .conn { border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    background: var(--surface); }
  .conn .row { align-items: center; gap: 10px; }
  .mono { font: 12px/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
  /* state at a glance: green connected, amber reachable-but-logged-out, red
     unreachable. Colour is never the only signal — the text says it too. */
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: var(--muted); }
  .dot.on { background: var(--green); }
  .dot.off { background: #d68910; }
  .dot.err { background: #c0392b; }
</style>
<main>
  <div class="top">
    <h1>lattice</h1>
  </div>

  <h2>ship</h2>
  <!-- the connected state is its own panel. Showing the login form whenever
       there was nothing better to say is what made an already-connected ship
       look logged out; the form is now revealed only when it is actually
       needed, or on request. -->
  <div id="conn" class="conn" hidden>
    <div class="row">
      <span id="dot" class="dot"></span>
      <div>
        <div id="conn-ship"><b>checking…</b></div>
        <div id="conn-url" class="muted mono"></div>
      </div>
    </div>
    <div class="row" style="margin-top:.7rem">
      <button id="open" class="primary" hidden>open lattice &rarr;</button>
      <button id="relog" hidden>reconnect</button>
      <button id="switch">change ship</button>
    </div>
  </div>

  <form id="connect" hidden>
    <input id="url" placeholder="https://your-ship.example.com" required>
    <input id="code" type="password" placeholder="+code" required>
    <div class="row">
      <button class="primary">connect</button>
      <button type="button" id="cancel" hidden>cancel</button>
      <span id="connect-status" class="muted"></span>
    </div>
  </form>

  <h2>mounts</h2>
  <p class="muted" style="margin:.2rem 0 .8rem">Project the page tree as local
  files — edit in your own editor, search with your own tools.</p>
  <p id="fuse-hint" class="err" hidden></p>
  <ul id="mount-list"></ul>
  <form id="add-mount">
    <input id="mp" placeholder="~/lattice (mountpoint)" required>
    <input id="mroot" placeholder="root (blank = whole tree)">
    <div class="row">
      <button>mount</button>
      <span id="mount-status" class="err"></span>
    </div>
  </form>
</main>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);

  // Show the login form only when logging in is actually the thing to do.
  // `connected` comes from a real authenticated request, not from "we have a
  // url in the config" — a stored url proves we logged in once, which is
  // precisely the state that used to render as logged out.
  const showForm = (on, cancelable) => {
    $('connect').hidden = !on;
    $('cancel').hidden = !cancelable;
    if (on) $('code').focus();
  };
  async function refreshConn() {
    $('conn').hidden = false;
    const s = await invoke('connection_status');
    $('url').value = s.url || $('url').value;
    $('conn-url').textContent = s.url || '';
    const dot = $('dot'), ship = $('conn-ship');
    if (s.connected) {
      dot.className = 'dot on';
      ship.innerHTML = '<b>connected</b> as ' + (s.ship || 'your ship');
      $('open').hidden = false; $('relog').hidden = true; $('switch').hidden = false;
      showForm(false, false);
    } else if (s.error) {
      dot.className = 'dot err';
      ship.innerHTML = '<b>cannot reach this ship</b>';
      $('conn-url').textContent = (s.url || '') + ' — ' + s.error;
      $('open').hidden = true; $('relog').hidden = false; $('switch').hidden = false;
      showForm(false, false);
    } else if (s.url) {
      dot.className = 'dot off';
      ship.innerHTML = '<b>signed out</b> — enter your +code to reconnect';
      $('open').hidden = true; $('relog').hidden = true; $('switch').hidden = false;
      showForm(true, false);
    } else {
      // never configured: the form IS the page, and there is nothing to cancel
      $('conn').hidden = true;
      showForm(true, false);
    }
  }
  refreshConn();
  $('open').onclick = () => invoke('go_home');
  $('relog').onclick = () => showForm(true, true);
  $('switch').onclick = () => { $('url').value = ''; showForm(true, true); $('url').focus(); };
  $('cancel').onclick = () => { showForm(false, false); refreshConn(); };

  $('connect').addEventListener('submit', async (e) => {
    e.preventDefault();
    const s = $('connect-status');
    s.textContent = 'connecting…'; s.className = 'muted';
    try {
      const ship = await invoke('connect', { url: $('url').value, code: $('code').value });
      s.textContent = 'connected as ' + ship;
      $('code').value = '';
      refreshConn();
    } catch (err) {
      s.textContent = String(err); s.className = 'err';
    }
  });

  async function refreshMounts() {
    const list = await invoke('list_mounts');
    const ul = $('mount-list');
    ul.textContent = '';
    for (const m of list) {
      const li = document.createElement('li');
      const c = document.createElement('code');
      c.textContent = m.mountpoint + (m.root ? '  ←  ' + m.root : '');
      const b = document.createElement('button');
      b.textContent = 'unmount';
      b.onclick = () => invoke('remove_mount', { mountpoint: m.mountpoint }).then(refreshMounts);
      li.appendChild(c); li.appendChild(b);
      ul.appendChild(li);
    }
  }
  invoke('status').then((s) => {
    if (!s.fuse_available) {
      const h = $('fuse-hint');
      h.textContent = s.hint; h.hidden = false;
      document.querySelector('#add-mount button').disabled = true;
    }
  });
  $('add-mount').addEventListener('submit', async (e) => {
    e.preventDefault();
    const st = $('mount-status');
    st.textContent = '';
    try {
      await invoke('add_mount', { mountpoint: $('mp').value, root: $('mroot').value });
      $('mp').value = ''; $('mroot').value = '';
      refreshMounts();
    } catch (err) { st.textContent = String(err); }
  });
  refreshMounts();
</script>
