<!doctype html>
<meta charset="utf-8">
<title>lattice</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; }
  input, button { font: inherit; }
  .err { color: #b00; white-space: pre-wrap; }
  section { margin-bottom: 1.5rem; }
  ul { padding-left: 1.2rem; }
  li { margin-bottom: .3rem; }
</style>
<h1>lattice</h1>
<section id="connect-panel">
  <h2>ship</h2>
  <form id="connect">
    <input id="url" placeholder="http://localhost:8080" size="28" required>
    <input id="code" type="password" placeholder="+code" size="28" required>
    <button>connect</button>
  </form>
  <p id="connect-status"></p>
</section>
<section id="mounts-panel">
  <h2>mounts</h2>
  <p id="fuse-hint" class="err" hidden></p>
  <ul id="mount-list"></ul>
  <form id="add-mount">
    <input id="mp" placeholder="~/lattice (mountpoint)" size="24" required>
    <input id="mroot" placeholder="root (blank = whole tree)" size="24">
    <button>mount</button>
  </form>
  <p id="mount-status" class="err"></p>
</section>
<script>
  const invoke = window.__TAURI__.core.invoke;

  // ship / connect
  invoke('get_config').then(c => { if (c.url) url.value = c.url; });
  document.getElementById('connect').addEventListener('submit', async e => {
    e.preventDefault();
    const s = document.getElementById('connect-status');
    s.textContent = 'connecting…'; s.className = '';
    try {
      const ship = await invoke('connect', { url: url.value, code: code.value });
      s.textContent = 'connected as ' + ship;
      code.value = '';
    } catch (err) {
      s.textContent = String(err); s.className = 'err';
    }
  });

  // mounts
  async function refreshMounts() {
    const list = await invoke('list_mounts');
    const ul = document.getElementById('mount-list');
    ul.textContent = '';
    for (const m of list) {
      const li = document.createElement('li');
      li.textContent = m.mountpoint + (m.root ? ' ← ' + m.root : '') + ' ';
      const b = document.createElement('button');
      b.textContent = 'unmount';
      b.onclick = () => invoke('remove_mount', { mountpoint: m.mountpoint }).then(refreshMounts);
      li.appendChild(b);
      ul.appendChild(li);
    }
  }
  invoke('status').then(s => {
    if (!s.fuse_available) {
      const h = document.getElementById('fuse-hint');
      h.textContent = s.hint; h.hidden = false;
      document.querySelector('#add-mount button').disabled = true;
    }
  });
  document.getElementById('add-mount').addEventListener('submit', async e => {
    e.preventDefault();
    const st = document.getElementById('mount-status');
    st.textContent = '';
    try {
      await invoke('add_mount', { mountpoint: mp.value, root: mroot.value });
      mp.value = ''; mroot.value = '';
      refreshMounts();
    } catch (err) { st.textContent = String(err); }
  });
  refreshMounts();
</script>
