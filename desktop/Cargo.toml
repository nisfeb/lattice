[package]
name = "lattice-desktop"
version = "0.8.0-rc4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fuser = { version = "0.18", default-features = false }
lattice-fs = { path = "../lattice-fs-rs" }
# the localhost bridge relays webview traffic to the ship (same build as
# lattice-fs's transport: rustls, no json/cookies)
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
# property tests only. Never in a release build.
proptest = "1.7"
