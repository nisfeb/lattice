[package]
name = "lattice-desktop"
version = "1.0.30"
edition = "2021"
#  Never goes to crates.io: the desktop app ships as bundles and lattice-fs
#  is consumed by path. Saying so keeps `cargo publish` from being a slip, and
#  is what lets cargo-deny treat these as workspace-internal.
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
#  a system notification when a ship shares a page or folder with this
#  one (commands::notify_share). Added without a `cargo update`, so the
#  rest of the lock stays as it was.
tauri-plugin-notification = "2"
#  already in the tree transitively, so naming it directly costs no build.
#  The vault archive crosses the IPC encoded, and hand-rolling a codec on a
#  path whose whole job is that the bytes arrive intact is not a saving.
base64 = "0.22"
#  already in the tree through rustls, with these features. The anonymous
#  identity file (src/cometid.rs) is sealed with its PBKDF2 and
#  ChaCha20-Poly1305, so moving an identity costs no new crate.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fuser = { version = "0.18", default-features = false }
lattice-fs = { path = "../lattice-fs-rs" }
# the localhost bridge relays webview traffic to the ship (same build as
# lattice-fs's transport: rustls, no json/cookies)
ureq = { version = "2", default-features = false, features = ["tls"] }
#  already in the tree through lattice-fs. Backup retention asks who owns a
#  file (geteuid), which std does not expose.
libc = "0.2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
#  urb:// links from other apps. deep-link declares the scheme to the OS and
#  delivers the link; single-instance forwards a link opened while the app is
#  running to that instance instead of starting a second one (src/urb.rs).
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
#  The urb engine: urb-fetch's Rust core, linked in so lattice reads pages
#  people publish on Urbit with no ship (the shipless reader, src/reader.rs).
#  docs/superpowers/specs/2026-11-03-desktop-urb-engine-design.md. One commit
#  for all three crates. Renamed because src/urb.rs (the urb:// link handler)
#  is `mod urb` and would shadow a crate called urb. mesa-sys builds libmesa's
#  C, which needs clang 18 or newer and MESA_SYS_DEPS (.cargo/config.toml,
#  filled by scripts/mesa-deps.sh). The lock pins prettyplease to 0.2.37:
#  bindgen 0.73 takes syn 2 or 3 and prettyplease 0.2 or 0.3, and a fresh
#  resolve pairs syn 2 with prettyplease 0.3 (syn 3), which does not compile.
#  The pin is urb-fetch main at the merge of PR #22 (a key cache never
#  takes an older point: life and rift compared in FileKeys::put and
#  settle_point). That sits on the merge of PR #20 (fast keys: a shared on-disk cache of ships' points
#  serves an engine's first lookup, never one after the roller answers), on
#  top of PR #19 (fast first scry), PR #18 (fast first contact) and PR #17
#  (Core::expire_revs for reloads).
urb-engine = { package = "urb", git = "https://github.com/nisfeb/urb-fetch.git", rev = "3f584bf3567dd8c8e80365197994b6330cb95338", features = ["native"], optional = true }
urb-render = { git = "https://github.com/nisfeb/urb-fetch.git", rev = "3f584bf3567dd8c8e80365197994b6330cb95338", optional = true }
urb-gateway = { git = "https://github.com/nisfeb/urb-fetch.git", rev = "3f584bf3567dd8c8e80365197994b6330cb95338", optional = true }

#  Export PDF prints through the platform's own webview (src/pdf.rs). All
#  four are already in the tree through tauri and wry, at these versions.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry", "NSDictionary", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[features]
#  Off for a target that cannot build libmesa: the app then ships without
#  the shipless reader, and the manager hides its card.
default = ["urb-engine"]
urb-engine = ["dep:urb-engine", "dep:urb-render", "dep:urb-gateway"]

[dev-dependencies]
# property tests only. Never in a release build.
proptest = "1.7"
