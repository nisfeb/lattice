[package]
name = "lattice-fs"
version = "0.1.0"
edition = "2021"
#  Never goes to crates.io: the desktop app ships as bundles and lattice-fs
#  is consumed by path. Saying so keeps `cargo publish` from being a slip, and
#  is what lets cargo-deny treat these as workspace-internal.
publish = false

[lib]
name = "lattice_fs"
path = "src/lib.rs"

[[bin]]
name = "lattice-fs"
path = "src/main.rs"

[dependencies]
# no libfuse-dev on this box: mount via fusermount3 instead of linking libfuse
fuser = { version = "0.18", default-features = false }
serde_json = "1"
# tls (rustls) so remote ships over https work; still no json/cookies
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"

[dev-dependencies]
# property tests only. Never in a release build.
proptest = "1.7"
shuttle = "0.9.1"

# `shuttle` is a custom cfg (RUSTFLAGS='--cfg shuttle'), not a feature, so the
# concurrency harness can never be compiled into a release build. See src/sync.rs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(shuttle)'] }
